name: "DBT Impact Analysis on PR"

on:
  pull_request:
    paths:
      - '**/*.sql'
      - '**/*.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  impact-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code (head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Fetch dqlabs_configurable_keys from base branch (3847)
        id: config
        run: |
          # Get the base branch name (3847)
          BASE_BRANCH="3847"
          
          # Fetch the impact_analysis.yml file from the base branch
          WORKFLOW_URL="https://raw.githubusercontent.com/${{ github.repository }}/${BASE_BRANCH}/.github/workflows/impact_analysis.yml"
          
          echo "Fetching workflow configuration from: $WORKFLOW_URL"
          
          # Download the workflow file
          WORKFLOW_CONTENT=$(curl -s "$WORKFLOW_URL" || echo "")
          
          if [ -z "$WORKFLOW_CONTENT" ]; then
            echo "Warning: Could not fetch workflow from base branch, using default"
            echo "dqlabs_configurable_keys=indirect_asset_count, direct_asset_list, indirect_asset_list, direct_column_count, sql_column_changes, yml_column_changes" >> $GITHUB_OUTPUT
          else
            echo "Workflow file fetched successfully"
            # Extract dqlabs_configurable_keys from the workflow file
            DQLABS_KEYS=$(echo "$WORKFLOW_CONTENT" | grep "dqlabs_configurable_keys:" | sed 's/.*dqlabs_configurable_keys: *"\([^"]*\)".*/\1/' | tr -d ' ')
            echo "dqlabs_configurable_keys=$DQLABS_KEYS" >> $GITHUB_OUTPUT
            echo "Using keys from 3847 branch: $DQLABS_KEYS"
          fi
 
      - name: Get changed DBT files
        id: changes
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.sql
            **/*.yml
          include_removed: true
          include_renamed: true
          separator: ","

      - name: Run DQLabs Impact Analysis
        id: impact-analysis
        uses: DQLmodel/DBT_model@3847
        with:
          api_client_id: ${{ secrets.DQLABS_API_CLIENT_ID }}
          api_client_secret: ${{ secrets.DQLABS_API_CLIENT_SECRET }}
          changed_files_list: ${{ steps.changes.outputs.all_changed_files }},${{ steps.changes.outputs.deleted_files }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dqlabs_base_url: ${{ secrets.DQLABS_BASE_URL }}
          dqlabs_createlink_url: ${{ secrets.DQLABS_CREATELINK_URL }}
          dqlabs_configurable_keys: "indirect_asset_count, direct_asset_list, direct_column_count,indirect_column_count, Sql_Column_Changes"

      - name: Show Summary in Logs
        run: echo "${{ steps.impact-analysis.outputs.impact_markdown }}"

      - name: Debug changed files
        run: |
          echo "All files: ${{ steps.changes.outputs.all_files }}"
          echo "Added files: ${{ steps.changes.outputs.added_files }}"
          echo "Modified files: ${{ steps.changes.outputs.modified_files }}"
          echo "Removed files: ${{ steps.changes.outputs.removed_files }}"
          echo "Renamed files: ${{ steps.changes.outputs.renamed_files }}"
          echo "All deleted_files	 files: ${{ steps.changes.outputs.deleted_files }}"
          echo "All deleted_files	 files: ${{ steps.changes.outputs }}"
          echo "Combined changed_files_list: ${{ steps.changes.outputs.all_changed_files }},${{ steps.changes.outputs.removed_files }}"
